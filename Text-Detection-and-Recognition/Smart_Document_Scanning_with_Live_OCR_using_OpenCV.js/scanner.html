<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Document Scanner + OCR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script async src="https://docs.opencv.org/4.x/opencv.js"
        onload="onOpenCvReady()"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  background:#020617;
  color:#e5e7eb;
  font-family:system-ui;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:24px;
}
.card{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:16px;
  margin-top:16px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
canvas{
  width:100%;
  background:#020617;
  border-radius:12px;
  border:1px dashed #1e293b;
}
.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:16px;
  align-items:center;
}
button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  position:relative;
}
.slider{
  margin-top:12px;
}
.slider label{
  font-size:14px;
  color:#94a3b8;
}
input[type=range]{
  width:100%;
}
textarea{
  width:100%;
  height:180px;
  background:#020617;
  color:#e5e7eb;
  border-radius:12px;
  border:1px solid #1e293b;
  padding:14px;
}
.status{
  padding:6px 14px;
  border-radius:999px;
  border:1px solid #1e293b;
  min-width:120px;
  text-align:center;
  display:inline-block;
}
</style>
</head>

<body>
<div class="container">

<h1> Document Scanner + OCR</h1>

<div class="card">
  <input type="file" id="fileInput" accept="image/*">
</div>

<div class="row">
  <div class="card">
    <h3>Original</h3>
    <canvas id="canvasInput"></canvas>
  </div>
  <div class="card">
    <h3>Scanned</h3>
    <canvas id="canvasOutput"></canvas>
  </div>
</div>

<div class="controls">
  <button id="addPageBtn" onclick="addPage()">➕ Add Page</button>
  <button onclick="runOCR()">🔍 OCR</button>
  <button onclick="downloadPDF()">⬇ PDF</button>
  <span class="status" id="status">Waiting…</span>
</div>

<div class="card">
<h3>OCR Fine Tuning</h3>

<div class="slider">
  <label>Text Area Size</label>
  <input type="range" id="areaSize" min="11" max="61" step="2" value="31">
</div>

<div class="slider">
  <label>Text Strength</label>
  <input type="range" id="textStrength" min="0" max="30" value="15">
</div>

<div class="slider">
  <label>Noise Removal</label>
  <input type="range" id="noiseLevel" min="0" max="7" step="1" value="0">
</div>

<div class="slider">
  <label>Text Thickness</label>
  <input type="range" id="morphSize" min="0" max="5" value="0">
</div>

<div class="slider">
  <label>
    <input type="checkbox" id="invertText"> White text on dark background
  </label>
</div>
</div>

<div class="card">
  <h3>Extracted Text</h3>
  <textarea id="ocrText"></textarea>
</div>

</div>

<script>
let inputCanvas, outputCanvas;
let scannedGray = null;
let ocrImage = null;
let scannedPages=[];
let status;
// debounce for live OCR
let ocrTimeout = null; 

function onOpenCvReady(){
  inputCanvas=document.getElementById("canvasInput");
  outputCanvas=document.getElementById("canvasOutput");
  status=document.getElementById("status");
  document.getElementById("fileInput").addEventListener("change",loadImage);

  ["areaSize","textStrength","noiseLevel","morphSize","invertText"]
    .forEach(id=>{
      document.getElementById(id).addEventListener("input",()=>{ 
        if(ocrTimeout) clearTimeout(ocrTimeout);
        // small delay for smooth live OCR
        ocrTimeout = setTimeout(updateOCR, 100); 
      });
    });

  status.innerText="OpenCV loaded ";
}

function loadImage(e){
  const img=new Image();
  img.onload=()=>{
    inputCanvas.width=img.width;
    inputCanvas.height=img.height;
    inputCanvas.getContext("2d").drawImage(img,0,0);
    scanDocument();
  };
  img.src=URL.createObjectURL(e.target.files[0]);
}

function scanDocument(){
  if(!inputCanvas.width) return;

  let src=cv.imread(inputCanvas);
  let gray=new cv.Mat();
  let blur=new cv.Mat();
  let edges=new cv.Mat();

  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
  cv.Canny(blur,edges,75,200);

  let contours=new cv.MatVector();
  let hierarchy=new cv.Mat();
  cv.findContours(edges,contours,hierarchy,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);

  let doc=null,maxArea=0;
  for(let i=0;i<contours.size();i++){
    let cnt=contours.get(i);
    let peri=cv.arcLength(cnt,true);
    let approx=new cv.Mat();
    cv.approxPolyDP(cnt,approx,0.02*peri,true);
    let area=cv.contourArea(cnt);
    if(approx.rows===4 && area>maxArea){
      doc=approx;maxArea=area;
    }
  }

  if(!doc) return;

  let pts=[];
  for(let i=0;i<4;i++)
    pts.push({x:doc.intPtr(i,0)[0],y:doc.intPtr(i,0)[1]});

  let o=orderPoints(pts);
  let w=Math.max(dist(o[0],o[1]),dist(o[2],o[3]));
  let h=Math.max(dist(o[0],o[3]),dist(o[1],o[2]));

  outputCanvas.width=w;
  outputCanvas.height=h;

  let srcPts=cv.matFromArray(4,1,cv.CV_32FC2,o.flatMap(p=>[p.x,p.y]));
  let dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,w,0,w,h,0,h]);

  let M=cv.getPerspectiveTransform(srcPts,dstPts);
  let warped=new cv.Mat();
  cv.warpPerspective(src,warped,M,new cv.Size(w,h));

  scannedGray=new cv.Mat();
  cv.cvtColor(warped,scannedGray,cv.COLOR_RGBA2GRAY);
  cv.imshow(outputCanvas,scannedGray);

  updateOCR();

  src.delete();gray.delete();blur.delete();edges.delete();
  contours.delete();hierarchy.delete();warped.delete();
  srcPts.delete();dstPts.delete();M.delete();
}

function updateOCR(){
  if(!scannedGray) return;

  status.innerText="Updating OCR…";

  let area=parseInt(document.getElementById("areaSize").value);
  let strength=parseInt(document.getElementById("textStrength").value);
  let noise=parseInt(document.getElementById("noiseLevel").value);
  let morph=parseInt(document.getElementById("morphSize").value);
  let invert=document.getElementById("invertText").checked;

  let mat=new cv.Mat();
  scannedGray.copyTo(mat);

  if(noise>0)
    cv.GaussianBlur(mat,mat,new cv.Size(noise*2+1,noise*2+1),0);

  cv.adaptiveThreshold(
    mat,mat,255,
    cv.ADAPTIVE_THRESH_GAUSSIAN_C,
    invert?cv.THRESH_BINARY_INV:cv.THRESH_BINARY,
    area,strength
  );

  if(morph>0){
    let kernel=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(morph,morph));
    cv.morphologyEx(mat,mat,cv.MORPH_CLOSE,kernel);
    kernel.delete();
  }

  ocrImage=matToDataURL(mat);
  mat.delete();

  // Live OCR update
  Tesseract.recognize(ocrImage,"eng").then(result=>{
    document.getElementById("ocrText").value=result.data.text;
    status.innerText="Ready ";
  });
}

async function runOCR(){
  if(!ocrImage) return;
  status.innerText="Running OCR…";
  const result=await Tesseract.recognize(ocrImage,"eng");
  document.getElementById("ocrText").value=result.data.text;
  status.innerText="OCR done ";
}

function addPage(){
  if(!outputCanvas.width) return;
  scannedPages.push(outputCanvas.toDataURL("image/jpeg",0.95));
  // temporary visual feedback
  status.innerText="+1 Page added ";
  setTimeout(()=>status.innerText="Ready ",1000);
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();
  scannedPages.forEach((img,i)=>{
    if(i>0) pdf.addPage();
    pdf.addImage(img,"JPEG",10,10,190,0);
  });
  pdf.save("scanned.pdf");
}

function orderPoints(p){
  let s=p.map(pt=>pt.x+pt.y);
  let d=p.map(pt=>pt.y-pt.x);
  return[
    p[s.indexOf(Math.min(...s))],
    p[d.indexOf(Math.min(...d))],
    p[s.indexOf(Math.max(...s))],
    p[d.indexOf(Math.max(...d))]
  ];
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function matToDataURL(mat){
  const c=document.createElement("canvas");
  c.width=mat.cols;c.height=mat.rows;
  cv.imshow(c,mat);
  return c.toDataURL("image/png");
}
</script>
</body>
</html>
